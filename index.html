<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waffle Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Waffle Store</h1>
        <div id="cart">Cart: <span id="cart-count">0</span></div>
    </header>
    <main>
        <div class="product" data-name="Classic Waffle" data-price="5">
            <img src="img/classic-waffle.jpg" alt="Classic Waffle">
            <h2>Classic Waffle</h2>
            <p>$5</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>
        <div class="product" data-name="Chocolate Waffle" data-price="7">
            <img src="img/chocolate-waffle.jpg" alt="Chocolate Waffle">
            <h2>Chocolate Waffle</h2>
            <p>$7</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>
        <div class="product" data-name="Strawberry Waffle" data-price="8">
            <img src="img/strawberry-waffle.jpg" alt="Strawberry Waffle">
            <h2>Strawberry Waffle</h2>
            <p>$8</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
